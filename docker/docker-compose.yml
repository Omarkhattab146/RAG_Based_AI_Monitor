services:
  mongodb:
    image: mongo:6.0.10-jammy
    container_name: mongodb
    ports:
      - "27007:27017"
    volumes:
      - mongo_data:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend
    restart: always
  
networks:
  backend:
volumes:
  mongo_data:
  