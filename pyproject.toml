[project]
name = "mini-rag-omar"
version = "0.1.0"
description = "RAG system with FastAPI + LangChain + Qdrant"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "aiofiles>=23.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "openai>=1.0.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=2.6.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.25.0",
    "pymongo>=4.6.0",
    "motor>=3.4.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "pydantic>=2.12.5",
]
